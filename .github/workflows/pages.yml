# Builds the static site (index.html, v2/index.html and v3/index.html) and deploys it to GitHub Pages on every push to main.
# Pull requests run the build job only (no deploy).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; only the deploy job gets Pages write + OIDC.
permissions:
  contents: read

# Only one deployment at a time; let an in-progress deploy finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the Pages site config
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check site entry point
        run: test -s index.html && test -s v2/index.html && test -s v3/index.html && ls fonts/*.woff2 && test -s .claude/hooks/security-briefing.js

      - name: Prepare site (site files only)
        run: |
          mkdir _site
          cp index.html _site/
          mkdir _site/v2
          cp v2/index.html _site/v2/
          mkdir _site/v3
          cp v3/index.html _site/v3/
          mkdir _site/fonts
          cp fonts/*.woff2 _site/fonts/
          mkdir -p _site/.claude/hooks
          cp .claude/hooks/security-briefing.js _site/.claude/hooks/

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
